name: Aktualizácia odberateľov

on:
  schedule:
    - cron: "0 5 * * *"   # každý deň o 5:00 UTC
  workflow_dispatch:       # dá sa spustiť aj ručne v záložke Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_subs.py
      - name: Uložiť zmeny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add subs.json
          git diff --cached --quiet || git commit -m "Aktualizácia počtu odberateľov"
          git push
